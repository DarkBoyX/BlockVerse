name: Build Studio for Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create and build the Studio app
        shell: bash
        run: |
          mkdir studio-app
          cp icon-512.png studio-app/icon.png
          cd studio-app
          cat > package.json <<'EOF'
          {
            "name": "blockverse-studio",
            "version": "1.0.0",
            "description": "BlockVerse Studio",
            "author": "DarkBoyX",
            "main": "main.js",
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.13.3"
            },
            "build": {
              "appId": "com.blockverse.studio",
              "productName": "BlockVerse Studio",
              "files": ["main.js", "icon.png"],
              "directories": { "output": "dist" },
              "win": { "target": "nsis", "icon": "icon.png" },
              "nsis": {
                "oneClick": false,
                "perMachine": false,
                "createDesktopShortcut": true,
                "artifactName": "BlockVerse-Studio-Setup.${ext}"
              }
            }
          }
          EOF
          cat > main.js <<'EOF'
          const { app, BrowserWindow, shell, Menu } = require("electron");
          const path = require("path");

          const SITE = "https://darkboyx.github.io/BlockVerse/studio.html";
          app.userAgentFallback = app.userAgentFallback + " BlockVerseStudio/1.0";
          app.commandLine.appendSwitch("ignore-gpu-blocklist");

          let win = null;

          // native loading screen: shows the moment the app opens, before the website has loaded
          const SPLASH_HTML = "<html><body style='margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0a0b;color:#f2f2f2;font-family:Segoe UI,sans-serif;-webkit-app-region:drag;user-select:none'>" +
            "<div style='width:72px;height:72px;border-radius:18px;background:linear-gradient(160deg,#3a3a3e,#101012);border:1px solid #333336;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#e8e8ea'>BV</div>" +
            "<div style='font-size:20px;font-weight:800'>BlockVerse Studio</div>" +
            "<div id='m' style='font-size:12px;color:#7a7a80'>Loading...</div>" +
            "<div style='width:180px;height:3px;border-radius:3px;background:#242428;overflow:hidden'><div style='width:40%;height:100%;background:#e8e8ec;animation:s 1.1s ease-in-out infinite'></div></div>" +
            "<style>@keyframes s{from{transform:translateX(-110%)}to{transform:translateX(280%)}}</style></body></html>";
          const OFFLINE_HTML = SPLASH_HTML.replace("Loading...", "Can't reach BlockVerse. Retrying...");

          let splash = null;
          function closeSplash(){ if(splash){ splash.destroy(); splash = null; } }

          function createWindow(){
            splash = new BrowserWindow({
              width: 420, height: 320, frame: false, resizable: false, movable: true, center: true,
              backgroundColor: "#0a0a0b", icon: path.join(__dirname, "icon.png"), alwaysOnTop: true, skipTaskbar: true
            });
            splash.loadURL("data:text/html;charset=utf-8," + encodeURIComponent(SPLASH_HTML));

            win = new BrowserWindow({
              width: 1440, height: 880, minWidth: 1000, minHeight: 640, show: false,
              backgroundColor: "#0a0a0b",
              icon: path.join(__dirname, "icon.png"),
              autoHideMenuBar: true,
              title: "BlockVerse Studio",
              webPreferences: { contextIsolation: true, nodeIntegration: false }
            });
            Menu.setApplicationMenu(null);
            win.webContents.setWindowOpenHandler(({ url }) => { shell.openExternal(url); return { action: "deny" }; });
            win.webContents.on("will-navigate", (e, url) => {
              if(!url.startsWith("https://darkboyx.github.io/")){
                e.preventDefault(); shell.openExternal(url);
              }
            });
            // no internet / site down: keep the splash up and retry instead of showing a blank error page
            win.webContents.on("did-fail-load", (e, code, desc, url, isMainFrame) => {
              if(!isMainFrame || code === -3) return;
              if(splash) splash.loadURL("data:text/html;charset=utf-8," + encodeURIComponent(OFFLINE_HTML));
              setTimeout(() => { if(win) win.loadURL(SITE); }, 4000);
            });
            // show the real window once the page has painted, then drop the splash
            win.webContents.once("did-finish-load", () => {
              setTimeout(() => { if(win){ win.show(); } closeSplash(); }, 400);
            });
            win.loadURL(SITE);
            win.on("closed", () => { win = null; closeSplash(); });
          }

          if(!app.requestSingleInstanceLock()){
            app.quit();
          } else {
            app.on("second-instance", () => {
              if(win){ if(win.isMinimized()) win.restore(); win.focus(); }
            });
            app.whenReady().then(createWindow);
            app.on("window-all-closed", () => app.quit());
          }
          EOF
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-windows
          name: BlockVerse Studio for Windows
          make_latest: false
          files: studio-app/dist/BlockVerse-Studio-Setup.exe
